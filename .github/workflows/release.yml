name: Release
# Bump version.Version in version/version.go in a PR first: the gate refuses a tag that differs
# from it ("v9.0.0-rc3" <-> tag v9.0.0-rc3). Pre-release tags (-rcN) publish a pre-release and never move :latest.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1
    with:
      version-source: go

  binaries:
    name: Binaries
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/go-release.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      binaries: HarukiToolboxBackend=.
      ldflags: -s -w -X {module}/version.Version={tag} -X {module}/version.Commit={commit} -X {module}/version.BuildDate={date}
      extra-files: |
        data
        haruki-toolbox-configs.example.yaml

  docker:
    name: Docker
    needs: gate
    if: needs.gate.outputs.is-tag == 'true' # dry runs never push images
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      # Built, not promoted: the version is compiled into the binary. VERSION is the full tag
      # (v9.0.0-rc3, as before: it ends up in the User-Agent), not the template's version-build-arg
      # value without "v". Image tags: :9.0.0-rc3 (plus :X.Y and :latest for stable tags only).
      build-args: |
        VERSION=${{ needs.gate.outputs.tag }}
        GIT_SHA=${{ github.sha }}
        BUILD_DATE=${{ github.event.head_commit.timestamp || 'unknown' }}
      cache-backend: registry
      cache-mode: max

  publish:
    name: GitHub Release
    needs: [gate, binaries, docker]
    if: needs.gate.outputs.is-tag == 'true'
    permissions:
      contents: write
    uses: seiunx-dev/ci-templates/.github/workflows/gh-release.yml@v1
    with:
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}
