# Static fallback structure for Hydra.
# Shared runtime values are injected via docker-compose environment variables.
#
# Device authorization (RFC 8628) is configured ONLY through docker-compose env
# (URLS_DEVICE_*, TTL_DEVICE_USER_CODE, OAUTH2_DEVICE_AUTHORIZATION_*), fed from
# the DEVICE_FLOW_* variables so Hydra and the backend share one user_code
# charset and length. Never add a user_code entropy preset here: the schema
# makes the preset and length/character_set mutually exclusive (oneOf).

serve:
  cookies:
    same_site_mode: Lax

urls:
  self:
    issuer: "https://toolbox-api.example.com"
  login: "https://toolbox-api.example.com/api/oauth2/login"
  consent: "https://toolbox-api.example.com/api/oauth2/consent"
  logout: "https://toolbox-api.example.com/logout"

secrets:
  system:
    - "change-me-hydra-system-secret-32bytes"

oidc:
  subject_identifiers:
    supported_types:
      - public
      - pairwise
    pairwise:
      salt: "change-me-hydra-subject-salt-32bytes"
