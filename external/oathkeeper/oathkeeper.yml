# Static Oathkeeper structure config.
# Shared runtime values are injected via docker-compose environment variables.

log:
  level: info
  format: json

serve:
  proxy:
    # Oathkeeper sits behind the edge proxy (WAF / TLS-terminating reverse
    # proxy); take the client address and scheme from X-Forwarded-*
    # (production has run with this since before it was tracked here).
    trust_forwarded_headers: true
    cors:
      enabled: true
      allowed_origins:
        - "https://toolbox.example.com"
      allowed_methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
      allowed_headers:
          - Authorization
          - Content-Type
          - Cookie
          - X-Requested-With
      exposed_headers:
          - Content-Type
      allow_credentials: true

errors:
  fallback:
    - json
  handlers:
    json:
      enabled: true
      config:
        verbose: true

access_rules:
  matching_strategy: regexp
  repositories:
    - file:///etc/config/oathkeeper/access-rules.yml

authenticators:
  noop:
    enabled: true
  cookie_session:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      extra_from: "@this"
      subject_from: "identity.id"
      only:
        - ory_kratos_session

authorizers:
  allow:
    enabled: true

mutators:
  noop:
    enabled: true
  header:
    enabled: true
    config:
      headers:
        # The header mutator uses the same deployment secret as the backend.
        X-Auth-Proxy-Secret: '{{ env "OATHKEEPER_SHARED_SECRET" }}'
        X-Kratos-Identity-Id: "{{ print .Subject }}"
        X-User-Name: "{{ print .Extra.identity.traits.name }}"
        X-User-Email: "{{ print .Extra.identity.traits.email }}"
        X-User-Email-Verified: '{{ $email := .Extra.identity.traits.email | print | trim | lower }}{{ $verified := false }}{{ range .Extra.identity.verifiable_addresses }}{{ if and $email .verified (eq (.value | print | trim | lower) $email) }}{{ $verified = true }}{{ end }}{{ end }}{{ print $verified }}'
        # Bind the proxy session marker to the real Kratos session id (extra_from
        # is "@this", so .Extra.id is the whoami session id) so the backend's admin
        # reauth is keyed to a proxy-vouched session, not a client-supplied value.
        X-Auth-Proxy-Session-Id: "{{ print .Extra.id }}"
        X-Auth-Proxy-Session-Aal: "{{ print .Extra.authenticator_assurance_level }}"
        # Overwrite/clear any client-supplied X-User-Id. The backend never trusts
        # it as authoritative (identity comes from X-Kratos-Identity-Id), but
        # clearing it here is defense-in-depth.
        X-User-Id: ""
