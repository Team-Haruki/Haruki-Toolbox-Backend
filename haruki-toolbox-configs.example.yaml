proxy: "http://mihomo:7890"

user_system:
  db_type: "postgres"
  db_url: "postgresql://user:password@postgres:5432/toolbox?sslmode=disable"
  cloudflare_secret: ""
  smtp:
    smtp_addr: ""
    smtp_port: 25
    smtp_mail: ""
    smtp_pass: ""
    mail_name: ""
    timeout_seconds: 10
  session_sign_token: ""
  auth_provider: "kratos" # kratos only
  auth_proxy_enabled: false # enable when backend is behind Oathkeeper
  auth_proxy_trusted_header: "X-Auth-Proxy-Secret"
  auth_proxy_trusted_value: ""
  auth_proxy_subject_header: "X-Kratos-Identity-Id"
  auth_proxy_name_header: "X-User-Name"
  auth_proxy_email_header: "X-User-Email"
  auth_proxy_email_verified_header: "X-User-Email-Verified"
  auth_proxy_user_id_header: "X-User-Id"
  kratos_public_url: "" # required when auth_provider=kratos
  kratos_admin_url: "" # required when auth_provider=kratos
  kratos_request_timeout_seconds: 10
  kratos_session_header: "X-Session-Token"
  kratos_session_cookie: "ory_kratos_session"
  kratos_auto_link_by_email: true
  kratos_auto_provision_user: true
  avatar_save_dir: "avatars"
  frontend_url: ""
  social_platform_verify_token: ""

mongodb: # Legacy namespace for private API credentials; no MongoDB connection
  private_api_secret: "Bearer "
  private_api_user_agent: ""

# Dedicated PostgreSQL store for Project Sekai suite/mysekai game data.
# Separate pool from `user_system` on purpose: that one runs Ent over lib/pq
# (text protocol), while these reads move whole json columns as bytes.
game_data:
  url: "postgres://user:pass@localhost:5432/haruki_gamedata?sslmode=disable"
  # PostgreSQL is the only supported read and write source.
  read_source: "postgres"
  # 0 keeps pgx's default ceiling (max(4, NumCPU)).
  max_conns: 0
  # 0 means "same as max_conns". Leave it there: pgx opens connections lazily,
  # so an unwarmed pool reports a spurious EmptyAcquireCount equal to the worker
  # count on the first burst after every restart.
  min_conns: 0

redis:
  host: "localhost"
  port: 6379
  password: ""   # 为空表示无密码

webhook:
  jwt_secret: ""
  enabled: true

afdian:
  user_id: ""
  api_token: ""
  api_base_url: "https://afdian.com/api/open"
  request_timeout_seconds: 10
  # Secret path segment appended to the webhook callback URL, e.g.
  # https://host/api/sponsor/afdian/callback/<webhook_secret>
  # Leave empty to disable the URL-secret gate (API verification still applies).
  webhook_secret: ""
  # Toggle the periodic background sync that pulls sponsors from the Afdian API.
  sync_enabled: true
  # Interval between background sync runs, in seconds (minimum 60).
  sync_interval_seconds: 300

oauth2:
  provider: "hydra" # hydra only
  hydra_public_url: "http://hydra-public:4444" # backend internal call target
  hydra_browser_url: "" # optional browser-facing public entrypoint; defaults to hydra_public_url
  hydra_admin_url: "http://hydra-admin:4445"
  hydra_client_id: ""
  hydra_client_secret: ""
  hydra_request_timeout_seconds: 10
  # RFC 8628 device authorization (POST /api/oauth2/device/auth and the device
  # branch of POST /api/oauth2/token). Validated at startup only when enabled;
  # enabling it requires user_system.session_sign_token (>= 16 characters),
  # which keys the HMACs in the flow's Redis key names. The flow answers only
  # when both this switch and the runtime switch oauth2DeviceFlowEnabled
  # (PUT /api/admin/config/runtime; missing = off) are on.
  device_flow:
    enabled: false # env OAUTH2_DEVICE_FLOW_ENABLED; also starts the unredeemed-approval reaper
    client_allowlist: [] # env OAUTH2_DEVICE_FLOW_CLIENT_ALLOWLIST (CSV); empty = every client holding the device grant
    verification_url: "" # env OAUTH2_DEVICE_FLOW_VERIFICATION_URL; empty = {user_system.frontend_url}/device
    hydra_issuer_url: "" # env OAUTH2_DEVICE_FLOW_HYDRA_ISSUER_URL; empty = oauth2.hydra_browser_url
    allowed_origins: [] # env OAUTH2_DEVICE_FLOW_ALLOWED_ORIGINS (CSV); empty = [origin of user_system.frontend_url]
    # The next three must equal Hydra's OAUTH2_DEVICE_AUTHORIZATION_USER_CODE_*
    # and TTL_DEVICE_USER_CODE (compose feeds both from DEVICE_FLOW_USER_CODE_*).
    user_code_charset: "BCDFGHJKLMNPQRSTVWXZ" # env OAUTH2_DEVICE_FLOW_USER_CODE_CHARSET; A-Z/0-9, >= 8 distinct
    user_code_length: 8 # env OAUTH2_DEVICE_FLOW_USER_CODE_LENGTH; 6-12
    user_code_ttl: "10m" # env OAUTH2_DEVICE_FLOW_USER_CODE_TTL; Go duration, 1m-30m
    min_poll_interval_seconds: 5 # floor of the interval handed to devices
    claim_ttl_seconds: 300 # lease of a browser's claim on a user code
    approve_lease_seconds: 30 # lease of one approval attempt; > approval_timeout_seconds + 10
    approval_timeout_seconds: 15 # deadline of the server-driven Hydra chain
    min_remaining_seconds_to_approve: 30 # >= approval_timeout_seconds
    max_approve_attempts: 3
    record_grace_seconds: 1800 # flow records outlive the user code by this much
    reaper_interval_seconds: 60
    reaper_grace_seconds: 60 # revoke unredeemed approvals this long after exp
    limits: # 10-minute windows unless named per_day
      auth_attempt_unknown_client_warn_per_10m: 6000 # warn only
      auth_attempt_client_warn_multiplier: 10 # warn only, x the client's max_codes_per_10m
      auth_issued_global_per_10m: 1200 # public + confidential pools must not exceed it; feeds the budget check
      auth_issued_public_per_10m: 600
      auth_issued_confidential_per_10m: 600
      auth_issued_client_default_per_10m: 60 # for clients without metadata.haruki.device.max_codes_per_10m
      lookup_user_per_10m: 30
      lookup_fail_user_per_10m: 5
      lookup_fail_user_per_day: 20
      lookup_fail_global_per_10m: 150 # hard cap; feeds the budget check
      decision_user_per_day: 20
      max_slow_down: 30 # pending flows fail after more early polls
      max_interval_seconds: 60
  # Internal token introspection for our own services (Sekai Station):
  # POST /internal/oauth2/introspect on the backend port, reachable only on the
  # private network / compose network, never via the public proxy (Oathkeeper
  # has no rule for it).
  # Callers send either "Authorization: Bearer <internal token>" or, as an
  # RFC 7662 client, HTTP Basic "<client_id>:<internal token>"; store only the
  # token's SHA-256 here (printf %s "$TOKEN" | sha256sum).
  internal_api:
    token_sha256: "" # env OAUTH2_INTERNAL_API_TOKEN_SHA256; 64 hex characters; empty = route not registered
    client_id: "station" # env OAUTH2_INTERNAL_API_CLIENT_ID; the only Basic username accepted; no colon; empty = station
    audience: ["station"] # env OAUTH2_INTERNAL_API_AUDIENCE (CSV); returned as "aud" in active answers; empty = [station]

backend:
  host: "0.0.0.0"
  port: 6666
  ssl: false
  ssl_cert: "fullchain.cer"
  ssl_key: "com.key"
  auto_migrate: false
  shutdown_timeout_seconds: 10
  log_level: "INFO"
  main_log_file: "main.log"
  # NOTE: this whole config file is env-interpolated (${VAR}) before YAML parsing.
  # The Fiber access-log tags below (${time}, ${status}, ${latency}, ${method},
  # ${path}) are preserved as-is UNLESS an environment variable of the same name
  # is set, in which case it would be substituted and corrupt the log format.
  # Do not set lowercase env vars that collide with these tag names.
  access_log: "[${time}] ${status} - ${latency} ${method} ${path}\n"
  access_log_path: "access.log"
  # Keep disabled until the backend is placed behind a known edge proxy. When
  # enabled, list only that proxy's exact IP (/32 or /128); trusting a LAN,
  # Docker, or Tailscale subnet lets any peer spoof X-Forwarded-For and bypass
  # IP-based rate limits.
  enable_trust_proxy: false
  trusted_proxies: []
  proxy_header: "X-Forwarded-For"
  # Opt-in performance instrumentation. When true, the backend periodically logs
  # PostgreSQL pool (including the game-data pool) / Go GC stats,
  # and logs a per-stage autopsy for box reads slower than 500ms. Off by default;
  # safe to enable during an incident to diagnose resource saturation. Env overrides:
  # BACKEND_PROFILING_ENABLED, BACKEND_PROFILING_INTERVAL_SECONDS.
  profiling_enabled: false
  profiling_interval_seconds: 15
  # HTTP server timeouts. read covers one request's headers and body (uploads
  # are up to ~25 MB, so keep room for slow links); write starts after the
  # handler returns, so long handlers such as inherit are not affected; idle
  # bounds a keep-alive connection waiting for its next request.
  read_timeout_seconds: 120
  write_timeout_seconds: 60
  idle_timeout_seconds: 120

third_party_data_provider:
  endpoint_8823: ""
  secret_8823: ""
  endpoint_sakura: ""
  secret_sakura: ""
  endpoint_resona: ""
  secret_resona: ""
  endpoint_luna: ""
  secret_luna: ""

sekai_api:
  api_endpoint: ""
  api_token: ""
  # Deadline for an owned-account profile view; a per-server entry overrides it.
  # TW is never bounded below 5 s (its healthy tail reaches past 4 s).
  profile_view_timeout_seconds: 5
  profile_view_timeout_seconds_by_server: {}
  # Deadline for the game-account binding verification lookup.
  verify_timeout_seconds: 10
  # Successful profile views are reused for this long (per server + game UID,
  # only after the caller's access check). Negative disables the cache.
  profile_cache_ttl_seconds: 60

haruki_proxy:
  # v3 uses OAuth2 game-data:write; no shared client/encryption key.
  # v3 always requires structured UA with platform. Independent from legacy version.
  v3_client_policy:
    allowed_channels: [stable, preview, beta, rc, dev]
    minimum_versions:
      stable: "3.0.0"
      preview: "3.0.0-preview"
      beta: "3.0.0-beta"
      rc: "3.0.0-rc"
      dev: "3.0.0-dev"
  # Legacy v2 settings; old endpoints retire on 2026-11-01 00:00:00 UTC+8.
  user_agent: "HarukiProxy"
  version: "v1.7.0"
  secret: ""
  unpack_key: ""

# AVSC file paths, loaded once at startup. Omitted/empty regions are disabled.
restore_mysekai:
  structures_file:
    cn: "./data/suite_user_cn_6.4.0.avsc"
    tw: ""
    kr: ""

# Suite restoration runs for every region with a configured schema.
# Regions without a schema retain their original fields.
restore_suite:
  structures_file:
    tw: "./data/suite_user.avsc"

# Hex-encoded AES material, configured independently for each region.
crypto:
  jp: {key: "", iv: ""}
  en: {key: "", iv: ""}
  cn: {key: "", iv: ""}
  tw: {key: "", iv: ""}
  kr: {key: "", iv: ""}

sekai_client:
  en_server_api_host: ""
  jp_server_api_host: ""
  tw_server_api_host: ""
  kr_server_api_host: ""
  cn_server_api_host: ""
  jp_server_inherit_token: ""
  en_server_inherit_token: ""
  jp_server_app_version_url: ""
  en_server_app_version_url: ""
  jp_server_inherit_client_headers:
    Host: ""
  en_server_inherit_client_headers:
    Host: ""
  # Pauses between game API calls during an inherit, in milliseconds. The
  # defaults below are the pacing the inherit flow has always used, modelled on
  # the real client; shortening them may get accounts flagged by the game's
  # anti-cheat, so change them only deliberately. 0 or omitted keeps the
  # default. A pause ends early when the inherit is cancelled or hits its
  # run deadline.
  inherit_pacing:
    after_inherit_check_ms: 1000 # env SEKAI_INHERIT_PAUSE_AFTER_CHECK_MS; between the checking and the executing inherit call
    before_login_ms: 2000 # env SEKAI_INHERIT_PAUSE_BEFORE_LOGIN_MS; between the executing inherit call and the login
    suite_followup_ms: 1000 # env SEKAI_INHERIT_PAUSE_SUITE_FOLLOWUP_MS; each of the three pauses around the suite follow-up calls


haruki_bot:
  db_url: "postgresql://user:password@postgres:5432/haruki_bot?sslmode=disable"
  enable_registration: false
  credential_sign_token: "" # must match Haruki-Cloud's credential_sign_token

# Bot security alerts raised by Haruki Cloud. Cloud posts each alert to the
# backend port with "Authorization: Bearer <ingest token>"; there is no
# Oathkeeper rule for it. Store only the token's SHA-256 here
# (printf %s "$TOKEN" | sha256sum). Admins read the alerts under /api/admin.
bot_security:
  ingest_token_sha256: "" # env BOT_SECURITY_INGEST_TOKEN_SHA256; 64 hex characters; empty = ingest disabled

subscription:
  hmes_internal_base_url: "http://haruki-hmes:7910"
  hmes_internal_token: ""
  user_agent: "Haruki-Toolbox-Backend"
  request_timeout_seconds: 5

