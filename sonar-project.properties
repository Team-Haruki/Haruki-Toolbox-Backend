sonar.projectKey=Team-Haruki_Haruki-Toolbox-Backend
sonar.organization=team-haruki

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Coverage comes from the CI `go test -coverprofile` run in .github/workflows/ci.yml.
sonar.go.coverage.reportPaths=coverage.out

# Ent owns these two trees: `go generate ./ent/toolbox` and `go generate ./ent/bot`
# overwrite them wholesale, so an issue raised inside them can never be fixed in
# place. 205 generated files across ~3.2 MB would also drown every real finding.
#
# collections.mysekai.json is a captured sample document (~900 KB) used to build
# the game-data catalog, not source.
sonar.exclusions=utils/database/postgresql/**,utils/database/neopg/**,collections.*.json
